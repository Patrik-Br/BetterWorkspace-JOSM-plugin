  <rect x="15.4" y="16.4" width="5.6" height="4.6" rx="0.6" fill="none" stroke="#e07b26" stroke-width="1.1"/>
  <line x1="15.4" y1="18" x2="21" y2="18" stroke="#e07b26" stroke-width="1.1"/>
  <line x1="16.8" y1="15.7" x2="16.8" y2="17" stroke="#e07b26" stroke-width="1.1" stroke-linecap="round"/>
  <line x1="19.6" y1="15.7" x2="19.6" y2="17" stroke="#e07b26" stroke-width="1.1" stroke-linecap="round"/>
</svg>
