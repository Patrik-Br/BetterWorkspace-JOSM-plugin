<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- imagery footprint grid -->
  <rect x="2" y="2" width="14" height="14" rx="1.2" fill="none" stroke="#1f6fb2" stroke-width="1.6"/>
  <line x1="9" y1="2" x2="9" y2="16" stroke="#1f6fb2" stroke-width="1.1" stroke-dasharray="1.6 1.4"/>
  <line x1="2" y1="9" x2="16" y2="9" stroke="#1f6fb2" stroke-width="1.1" stroke-dasharray="1.6 1.4"/>
